name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for a manual dry run)"
        required: false

permissions:
  contents: write

jobs:
  distributions:
    name: sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  windows-app:
    name: Windows all-in-one executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        # PySide6 is deliberately absent: the executable downloads it into the
        # user's data folder on first run. customtkinter draws that wizard.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[bootstrap]"
          python -m pip install pyinstaller==6.11.1
      - name: Bake in the Twitch application id
        # A client id is public by design - Twitch documents it as embeddable,
        # and it ships readable inside every binary. It is kept out of the
        # repository only so forks do not inherit this project's identity and
        # rate limits. Never put a client *secret* here: WheelHat authenticates
        # as a public client over the device code flow and has no use for one.
        #
        # An unset secret is not a failure. The build simply carries no id and
        # asks the user for theirs, which is what a source build does anyway.
        shell: pwsh
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
        run: |
          $id = "$env:TWITCH_CLIENT_ID".Trim()
          if (-not $id) {
            Write-Host "::warning::No TWITCH_CLIENT_ID secret; this build will ask users for their own."
            exit 0
          }
          if ($id -notmatch '^[A-Za-z0-9]+$') { throw "TWITCH_CLIENT_ID is not a bare client id" }
          $file = "wheelhat/twitch/client_id.py"
          $text = Get-Content $file -Raw
          $updated = $text -replace 'BUNDLED_CLIENT_ID = ""', "BUNDLED_CLIENT_ID = `"$id`""
          if ($updated -eq $text) { throw "could not find BUNDLED_CLIENT_ID to replace in $file" }
          Set-Content $file $updated -Encoding utf8 -NoNewline
          Write-Host "Baked in a client id of $($id.Length) characters."
      - name: Build
        run: pyinstaller build/wheelhat.spec --noconfirm --clean --distpath dist --workpath build/work
      - name: Refuse to ship a build with Qt baked in
        # If PySide6 ever ends up bundled, the LGPL position changes and the
        # download is pointless. Fail the release rather than publish it.
        shell: pwsh
        run: |
          $exe = "dist/WheelHat.exe"
          if (-not (Test-Path $exe)) { throw "no executable was produced" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host ("built {0:N1} MB" -f $size)
          if ($size -gt 120) { throw "executable is ${size} MB - PySide6 may have been bundled" }
      - name: Smoke test headlessly
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath dist/WheelHat.exe -ArgumentList "--server","--no-browser","--port","8797" -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 2
            try {
              if ((Invoke-WebRequest http://127.0.0.1:8797/health -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200) {
                Invoke-WebRequest http://127.0.0.1:8797/ -UseBasicParsing -TimeoutSec 5 | Out-Null
                $ok = $true; break
              }
            } catch { }
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "the packaged app did not serve /health" }
      - uses: actions/upload-artifact@v7
        with:
          name: WheelHat-windows
          path: dist/WheelHat.exe

  publish:
    name: Attach to the GitHub Release
    runs-on: ubuntu-latest
    needs: [distributions, windows-app]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/dist/*
            artifacts/WheelHat-windows/WheelHat.exe
