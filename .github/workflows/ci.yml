name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        # Pinned so a new ruff release cannot break CI on an unrelated PR.
        run: pipx install ruff==0.16.4
      - name: Check the third-party notices are current
        # Attribution is a licence obligation, not documentation. This fails if
        # a dependency was added without being attributed.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[bootstrap]"
          python scripts/gen_notices.py --check
      - name: Lint
        # Rules and line length come from [tool.ruff] in pyproject.toml.
        run: ruff check --output-format=github .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        # The suite binds loopback ports and drives stand-in servers for OBS,
        # VTube Studio, Streamer.bot, Mix It Up, SAMMI, Speaker.bot and VNyan.
        run: python -m pytest -q --durations=10

  build:
    name: build distributions
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify the wheel ships the web assets
        # The control panel and overlay are package data; a wheel without them
        # installs cleanly and then serves a blank page.
        run: |
          python -m pip install dist/*.whl
          python - <<'PY'
          import pathlib, wheelhat
          root = pathlib.Path(wheelhat.__file__).parent
          required = [
              "web/index.html",
              "web/overlay.html",
              "web/static/js/app.js",
              "web/static/js/wheel-canvas.js",
              "web/static/css/app.css",
          ]
          missing = [r for r in required if not (root / r).exists()]
          assert not missing, f"wheel is missing packaged assets: {missing}"
          print(f"wheel OK: {len(list((root / 'web').rglob('*')))} web files packaged")
          PY
      - name: Smoke test the installed app
        run: |
          python -m wheelhat --server --no-browser --port 8799 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8799/health && break || sleep 1
          done
          curl -sf http://127.0.0.1:8799/health
          curl -sf http://127.0.0.1:8799/ -o /dev/null
          curl -sf http://127.0.0.1:8799/api/wheels -o /dev/null
          echo "installed app serves the panel and the API"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14
